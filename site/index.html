<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa del viaggio · Cina</title>
<meta name="description" content="Mappa interattiva delle tappe del viaggio in Cina: percorsi possibili da Pechino a Shanghai o Hong Kong, con schede di dettaglio per ogni località.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div id="chinamap" class="map"></div>

  <!-- LEFT: routes / regions -->
  <div class="panel-left">
    <div class="panel-left__header">
      <div class="panel-left__title-row">
        <div>
          <div class="eyebrow">Mappa del viaggio</div>
          <div class="title-row">
            <h1 class="title-cn">Cina</h1>
            <span class="title-cn-sub">中国</span>
          </div>
        </div>
        <span class="season-chip">🍂 Fine ottobre</span>
      </div>
      <p class="summary" id="summaryText"></p>

      <div class="tabs">
        <button class="tab" id="tabPercorsi" data-panel="percorsi" type="button">Percorsi</button>
        <button class="tab" id="tabAree" data-panel="aree" type="button">Tutte le aree</button>
      </div>
    </div>

    <div class="scrolly panel-left__body">
      <div id="routesList"></div>
      <div id="areasList"></div>
    </div>

    <div class="panel-left__footer">
      <button class="show-all-btn" id="showAllBtn" type="button">
        <span class="show-all-icon">◎</span> Inquadra tutta la Cina
      </button>
    </div>
  </div>

  <!-- RIGHT: detail drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer__accent"></div>
    <div class="drawer__close-row">
      <button class="close-btn" id="closeBtn" type="button" aria-label="Chiudi">✕</button>
    </div>
    <div class="scrolly drawer__body" id="drawerBody"></div>
  </div>

</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
